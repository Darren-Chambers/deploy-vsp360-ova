---
- name: Test datastore info attributes
  hosts: localhost
  gather_facts: false

  vars_files:
    - "./ansible_vault_vars/ansible_vault.yml"

  vars:
    # Simulate different scenarios by changing this value
    # Scenario 1 — exact match from previous run
    #simulated_existing_default: "3DC-JDT (Free: 173.0 GB)"
    # Scenario 2 — stale free space from previous run
     simulated_existing_default: "3DC-JDT (Free: 999.9 GB)"
    # Scenario 3 — no previous default
    # simulated_existing_default: ""
    # Scenario 4 — datastore no longer exists
    # simulated_existing_default: "DELETED-DS (Free: 1.0 TB)"

  tasks:

    - name: Check if site vars file exists
      ansible.builtin.stat:
        path: "./vars/site_config.yml"
      register: site_config_stat

    - name: Include site vars file if present
      ansible.builtin.include_vars:
        file: "./vars/site_config.yml"
      when: site_config_stat.stat.exists

    - name: Fetch datastores from vCenter
      community.vmware.vmware_datastore_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
      delegate_to: localhost
      register: datastore_info

    - name: Filter accessible datastores only
      ansible.builtin.set_fact:
        accessible_datastores: >-
          {{
            datastore_info.datastores
            | selectattr('accessible', 'equalto', true)
            | sort(attribute='name')
            | list
          }}

    - name: Fail early if no accessible datastores found
      ansible.builtin.fail:
        msg: "No accessible datastores found in vCenter datacenter {{ vcenter_datacenter }}."
      when: accessible_datastores | length == 0

    - name: Build datastore names with free space labels
      ansible.builtin.set_fact:
        datastore_names: >-
          {{
            datastore_names | default([])
            + [
                item.name + ' (Free: ' +
                (
                  (item.freeSpace / 1099511627776) | round(1) | string + ' TB'
                  if item.freeSpace >= 1099511627776
                  else (item.freeSpace / 1073741824) | round(1) | string + ' GB'
                ) +
                ')'
              ]
          }}
      loop: "{{ accessible_datastores }}"

    - name: DEBUG | Show formatted datastore choices
      ansible.builtin.debug:
        msg: "{{ datastore_names }}"

    - name: Resolve datastore default from existing survey
      ansible.builtin.set_fact:
        resolved_datastore_default: >-
          {{
            datastore_names
            | select('search', '^' + (simulated_existing_default | regex_replace(' \(Free:.*\)$', '')) + ' ')
            | list
            | first
            | default(datastore_names | first)
          }}

    - name: "DEBUG | Show default resolution results"
      ansible.builtin.debug:
        msg:
          - "======== DATASTORE DEFAULT RESOLUTION ========"
          - "Simulated existing default : {{ simulated_existing_default }}"
          - "Stripped name              : {{ simulated_existing_default | regex_replace(' \\(Free:.*\\)$', '') }}"
          - "Resolved new default       : {{ resolved_datastore_default }}"
          - "Resolution method          : {{ 'matched by name' if simulated_existing_default | regex_replace(' \\(Free:.*\\)$', '') in resolved_datastore_default else 'fell back to first' }}"
